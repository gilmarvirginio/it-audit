name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Compilar iOS
        run: flutter build ios --release --no-codesign

      - name: Criar IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r it-audit-ios.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: it-audit-ios
          path: it-audit-ios.ipa
